name: Update profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/profile_v3.py"
      - ".github/scripts/enhance_scans.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/profile_v3.py

      - name: Increase scan cadence
        run: python .github/scripts/enhance_scans.py

      - name: Commit changed telemetry
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-hero.svg; then
            echo "Profile telemetry is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-hero.svg
          git commit -m "chore: refresh profile telemetry"
          git push
