<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Strecker developer profile</title>
  <desc id="desc">Animated dark technical dashboard introducing Strecker, focused on Windows software, performance, automation and local AI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0C"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101510"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#76B900" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14191F"/>
      <stop offset="1" stop-color="#0F1318"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C2229" stroke-width="1" opacity="0.7"/>
    </pattern>
    <clipPath id="screenClip"><rect x="36" y="32" width="1128" height="406" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
    .muted { fill: #8B949E; }
    .bright { fill: #F0F6FC; }
    .accent { fill: #76B900; }
    .thin { stroke: #30363D; stroke-width: 1; }

    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
    @keyframes scan { from { transform: translateX(-850px) } to { transform: translateX(1450px) } }
    @keyframes dash { to { stroke-dashoffset:-44 } }
    @keyframes reveal1 { 0%,6% { opacity:0; transform:translateY(6px)} 12%,100% {opacity:1; transform:translateY(0)} }
    @keyframes reveal2 { 0%,18% { opacity:0; transform:translateY(6px)} 24%,100% {opacity:1; transform:translateY(0)} }
    @keyframes reveal3 { 0%,30% { opacity:0; transform:translateY(6px)} 36%,100% {opacity:1; transform:translateY(0)} }
    @keyframes waveform { 0%,100% { transform:translateY(0)} 50% {transform:translateY(-4px)} }
    @keyframes nodePulse { 0%,100% { r:2; opacity:.45 } 50% { r:4; opacity:1 } }

    .scan { animation: scan 6.5s linear infinite; }
    .dash { stroke-dasharray: 6 8; animation: dash 2.4s linear infinite; }
    .r1 { animation: reveal1 8s ease infinite; }
    .r2 { animation: reveal2 8s ease infinite; }
    .r3 { animation: reveal3 8s ease infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .status { animation: pulse 2.2s ease-in-out infinite; }
    .wave { animation: waveform 2.8s ease-in-out infinite; transform-origin:center; }
    .node { animation: nodePulse 2.6s ease-in-out infinite; }
  </style>

  <rect width="1200" height="470" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="434" rx="20" fill="none" stroke="#21262D"/>
  <rect x="36" y="32" width="1128" height="406" rx="16" fill="url(#panel)" stroke="#30363D"/>
  <g clip-path="url(#screenClip)">
    <rect x="36" y="32" width="1128" height="406" fill="url(#grid)" opacity="0.5"/>
    <rect class="scan" x="-420" y="32" width="360" height="406" fill="url(#greenGlow)" opacity="0.10"/>
  </g>

  <circle cx="62" cy="57" r="5" fill="#30363D"/>
  <circle cx="80" cy="57" r="5" fill="#30363D"/>
  <circle cx="98" cy="57" r="5" fill="#30363D"/>
  <text x="124" y="62" class="mono muted" font-size="13">strecker@github: ~/profile</text>
  <circle cx="1040" cy="57" r="4" fill="#76B900" class="status" filter="url(#softGlow)"/>
  <text x="1053" y="62" class="mono" fill="#A7D75B" font-size="12">ONLINE</text>
  <text x="1120" y="62" class="mono muted" font-size="12">v2.0</text>
  <line x1="54" y1="80" x2="1146" y2="80" class="thin"/>

  <text x="72" y="138" class="sans bright" font-size="54" font-weight="700" letter-spacing="-1">Strecker</text>
  <rect x="72" y="154" width="90" height="4" rx="2" fill="#76B900"/>
  <text x="72" y="188" class="mono muted" font-size="15">WINDOWS SOFTWARE  /  PERFORMANCE  /  AUTOMATION  /  LOCAL AI</text>

  <g transform="translate(72 226)">
    <text x="0" y="0" class="mono accent" font-size="15">$</text>
    <text x="20" y="0" class="mono bright r1" font-size="15">whoami</text>
    <text x="0" y="28" class="mono muted r1" font-size="14">developer focused on fast, practical desktop tools</text>

    <text x="0" y="70" class="mono accent r2" font-size="15">$</text>
    <text x="20" y="70" class="mono bright r2" font-size="15">cat focus.txt</text>
    <text x="0" y="98" class="mono muted r2" font-size="14">C# · .NET · WPF · performance analysis · local AI</text>

    <text x="0" y="140" class="mono accent r3" font-size="15">$</text>
    <text x="20" y="140" class="mono bright r3" font-size="15">status --current</text>
    <text x="0" y="168" class="mono r3" fill="#A7D75B" font-size="14">building, measuring, refining</text>
    <rect x="231" y="154" width="8" height="18" class="cursor r3" fill="#76B900"/>
  </g>

  <g transform="translate(790 112)">
    <rect width="326" height="232" rx="14" fill="#0B0F13" stroke="#30363D"/>
    <text x="22" y="32" class="mono muted" font-size="12">DEV TELEMETRY</text>
    <text x="278" y="32" class="mono accent" font-size="12">LIVE</text>
    <line x1="22" y1="46" x2="304" y2="46" class="thin"/>

    <text x="22" y="78" class="mono muted" font-size="12">PRIMARY</text>
    <text x="118" y="78" class="mono bright" font-size="13">C# / .NET</text>
    <text x="22" y="106" class="mono muted" font-size="12">UI</text>
    <text x="118" y="106" class="mono bright" font-size="13">WPF / Windows</text>
    <text x="22" y="134" class="mono muted" font-size="12">FOCUS</text>
    <text x="118" y="134" class="mono bright" font-size="13">Performance + UX</text>
    <text x="22" y="162" class="mono muted" font-size="12">MODE</text>
    <text x="118" y="162" class="mono accent" font-size="13">BUILDING</text>

    <path class="dash wave" d="M22 202 C45 192,56 210,75 200 S104 186,121 202 S148 216,166 199 S197 187,214 202 S248 214,266 198 S290 190,304 201" fill="none" stroke="#76B900" stroke-width="2" opacity="0.85"/>
    <circle cx="22" cy="202" r="2" fill="#76B900" class="node"/>
    <circle cx="121" cy="202" r="2" fill="#76B900" class="node" style="animation-delay:.5s"/>
    <circle cx="214" cy="202" r="2" fill="#76B900" class="node" style="animation-delay:1s"/>
    <circle cx="304" cy="201" r="2" fill="#76B900" class="node" style="animation-delay:1.5s"/>
  </g>

  <text x="72" y="438" class="mono muted" font-size="11">PROFILE INTERFACE // CUSTOM SVG</text>
  <text x="982" y="438" class="mono muted" font-size="11">GITHUB.COM/STRECKERMX</text>
</svg>