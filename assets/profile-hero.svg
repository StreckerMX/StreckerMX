<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="860" viewBox="0 0 3600 860" role="img" aria-labelledby="title desc">
  <title id="title">Strecker profile hero</title>
  <desc id="desc">Wide animated dark dashboard profile for Strecker, with one-time terminal reveals and a subtle continuous green scan.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090C"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101410"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A20"/>
      <stop offset="1" stop-color="#0F1318"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#76B900" stop-opacity="0.025"/>
      <stop offset="0.5" stop-color="#76B900" stop-opacity="0.14"/>
      <stop offset="0.65" stop-color="#76B900" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fg { fill:#F2F5F7; }
      .muted { fill:#97A4B2; }
      .dim { fill:#6F7D8B; }
      .green { fill:#76B900; }
      .panelStroke { stroke:rgba(255,255,255,0.08); }
      .headline { font-size:164px; font-weight:700; }
      .subtitle { font-size:52px; letter-spacing:.11em; }
      .tiny { font-size:30px; letter-spacing:.13em; }
      .top { font-size:34px; }
      .cardTitle { font-size:40px; letter-spacing:.13em; }
      .cardState { font-size:36px; letter-spacing:.10em; }
      .prompt { font-size:50px; font-weight:650; }
      .terminal { font-size:38px; }
      .section { font-size:56px; font-weight:650; }
      .body { font-size:37px; }
      .label { font-size:32px; letter-spacing:.10em; }
      .value { font-size:38px; font-weight:600; }
    </style>

    <clipPath id="c1"><rect x="150" y="365" width="0" height="70"><animate attributeName="width" from="0" to="460" begin=".45s" dur=".55s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="190" y="425" width="0" height="62"><animate attributeName="width" from="0" to="880" begin="1.05s" dur="1.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="150" y="515" width="0" height="70"><animate attributeName="width" from="0" to="520" begin="2.1s" dur=".65s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="190" y="575" width="0" height="62"><animate attributeName="width" from="0" to="980" begin="2.8s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="150" y="665" width="0" height="70"><animate attributeName="width" from="0" to="410" begin="4.0s" dur=".55s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="190" y="725" width="0" height="62"><animate attributeName="width" from="0" to="680" begin="4.6s" dur=".85s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="3600" height="860" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="3596" height="856" rx="26" fill="none" stroke="rgba(118,185,0,.16)"/>
  <rect x="22" y="22" width="3556" height="816" rx="22" fill="none" stroke="rgba(255,255,255,.055)"/>

  <rect x="-560" y="0" width="560" height="860" fill="url(#scanGradient)">
    <animate attributeName="x" from="-560" to="4160" dur="14s" repeatCount="indefinite"/>
  </rect>

  <circle cx="58" cy="48" r="8" fill="#374151"/>
  <circle cx="88" cy="48" r="8" fill="#2E3A46"/>
  <circle cx="118" cy="48" r="8" fill="#23303B"/>
  <text x="168" y="58" class="mono muted top">strecker@github: ~/profile</text>
  <circle cx="3260" cy="48" r="8" fill="#76B900" filter="url(#softGlow)"/>
  <text x="3292" y="58" class="mono green top">ONLINE</text>
  <text x="3520" y="58" class="mono dim top" text-anchor="end">v4.0</text>
  <line x1="54" y1="86" x2="3546" y2="86" stroke="rgba(255,255,255,.08)"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur=".4s" fill="freeze"/>
    <text x="110" y="205" class="sans fg headline">Strecker</text>
    <rect x="112" y="226" width="330" height="16" rx="8" fill="#76B900"/>
    <text x="110" y="304" class="mono muted subtitle">WINDOWS SOFTWARE / PERFORMANCE / AUTOMATION / LOCAL AI</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".2s" dur=".35s" fill="freeze"/>
    <rect x="105" y="332" width="1060" height="470" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="150" y="388" class="mono dim cardTitle">IDENTITY</text>
    <text x="1110" y="388" class="mono green cardState" text-anchor="end">ACTIVE</text>
    <line x1="150" y1="414" x2="1110" y2="414" stroke="rgba(255,255,255,.08)"/>

    <text x="150" y="470" class="mono green prompt" clip-path="url(#c1)">$ whoami</text>
    <text x="190" y="522" class="mono muted terminal" clip-path="url(#c2)">developer building fast, practical desktop tools</text>

    <text x="150" y="620" class="mono green prompt" clip-path="url(#c3)">$ focus.list</text>
    <text x="190" y="672" class="mono muted terminal" clip-path="url(#c4)">Windows · performance · automation · local AI</text>

    <text x="150" y="742" class="mono green prompt" clip-path="url(#c5)">$ status</text>
    <text x="190" y="794" class="mono green terminal" clip-path="url(#c6)">building, measuring, refining</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur=".5s" fill="freeze"/>
    <rect x="1270" y="332" width="1060" height="470" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="1315" y="388" class="mono dim cardTitle">TOOLBOX / WORKFLOW</text>
    <text x="2275" y="388" class="mono green cardState" text-anchor="end">CURRENT</text>
    <line x1="1315" y1="414" x2="2275" y2="414" stroke="rgba(255,255,255,.08)"/>

    <text x="1315" y="480" class="mono dim label">CORE STACK</text>
    <text x="1645" y="480" class="mono fg value">C# · .NET 10 · WPF</text>

    <text x="1315" y="550" class="mono dim label">AUTOMATION</text>
    <text x="1645" y="550" class="mono fg value">Python · PowerShell · GitHub Actions</text>

    <circle cx="1330" cy="626" r="8" fill="#76B900"/>
    <text x="1370" y="640" class="sans fg body">Build practical tools, not noisy demos</text>
    <circle cx="1330" cy="696" r="8" fill="#76B900"/>
    <text x="1370" y="710" class="sans fg body">Turn raw data into something readable</text>
    <circle cx="1330" cy="766" r="8" fill="#76B900"/>
    <text x="1370" y="780" class="sans fg body">Keep interfaces fast, clean, and useful</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur=".5s" fill="freeze"/>
    <rect x="2435" y="332" width="1060" height="470" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="2480" y="388" class="mono dim cardTitle">FEATURED WORK</text>
    <text x="3440" y="388" class="mono green cardState" text-anchor="end">PUBLIC</text>
    <line x1="2480" y1="414" x2="3440" y2="414" stroke="rgba(255,255,255,.08)"/>

    <text x="2480" y="500" class="sans fg section">FrameView Analyzer</text>
    <text x="2480" y="560" class="sans muted body">Native Windows benchmark analysis workspace</text>
    <text x="2480" y="616" class="sans muted body">for NVIDIA FrameView captures and NVIDIA App logs.</text>

    <line x1="2480" y1="650" x2="3440" y2="650" stroke="rgba(255,255,255,.065)"/>
    <text x="2480" y="704" class="mono dim label">PRIMARY</text>
    <text x="2780" y="704" class="mono fg value">C# / .NET</text>
    <text x="2480" y="762" class="mono dim label">FOCUS</text>
    <text x="2780" y="762" class="mono green value">PERFORMANCE + UX</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur=".45s" fill="freeze"/>
    <line x1="54" y1="820" x2="3546" y2="820" stroke="rgba(255,255,255,.07)"/>
    <text x="110" y="848" class="mono dim tiny">PROFILE INTERFACE / CUSTOM SVG / SINGLE-LOAD INTRO</text>
    <text x="3490" y="848" class="mono dim tiny" text-anchor="end">GITHUB.COM/STRECKERMX</text>
  </g>
</svg>