<svg xmlns="http://www.w3.org/2000/svg" width="860" height="3600" viewBox="0 0 860 3600" role="img" aria-labelledby="title desc">
  <title id="title">Strecker profile hero</title>
  <desc id="desc">Tall animated dark dashboard profile for Strecker with one-time text reveals and a subtle continuous green scan.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090C"/>
      <stop offset="0.56" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101410"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A20"/>
      <stop offset="1" stop-color="#0F1318"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#76B900" stop-opacity="0.025"/>
      <stop offset="0.5" stop-color="#76B900" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#76B900" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fg { fill:#F2F5F7; }
      .muted { fill:#97A4B2; }
      .dim { fill:#6F7D8B; }
      .green { fill:#76B900; }
      .panelStroke { stroke:rgba(255,255,255,0.08); }
      .top { font-size:18px; }
      .headline { font-size:78px; font-weight:700; }
      .subtitle { font-size:22px; letter-spacing:.10em; }
      .cardTitle { font-size:18px; letter-spacing:.15em; }
      .cardState { font-size:17px; letter-spacing:.11em; }
      .prompt { font-size:27px; font-weight:650; }
      .terminal { font-size:23px; }
      .section { font-size:36px; font-weight:650; }
      .body { font-size:24px; }
      .label { font-size:18px; letter-spacing:.11em; }
      .value { font-size:25px; font-weight:600; }
      .small { font-size:17px; }
      .micro { font-size:14px; letter-spacing:.12em; }
    </style>

    <clipPath id="c1"><rect x="70" y="600" width="0" height="40"><animate attributeName="width" from="0" to="170" begin=".45s" dur=".5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="92" y="650" width="0" height="38"><animate attributeName="width" from="0" to="630" begin="1.0s" dur="1.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="70" y="754" width="0" height="40"><animate attributeName="width" from="0" to="200" begin="2.2s" dur=".6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="92" y="804" width="0" height="38"><animate attributeName="width" from="0" to="575" begin="2.85s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="70" y="908" width="0" height="40"><animate attributeName="width" from="0" to="145" begin="4.0s" dur=".55s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="92" y="958" width="0" height="38"><animate attributeName="width" from="0" to="420" begin="4.6s" dur=".9s" fill="freeze"/></rect></clipPath>

    <clipPath id="c7"><rect x="70" y="1260" width="0" height="40"><animate attributeName="width" from="0" to="220" begin="5.7s" dur=".65s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="92" y="1310" width="0" height="38"><animate attributeName="width" from="0" to="610" begin="6.4s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c9"><rect x="70" y="1414" width="0" height="40"><animate attributeName="width" from="0" to="190" begin="7.55s" dur=".6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c10"><rect x="92" y="1464" width="0" height="38"><animate attributeName="width" from="0" to="615" begin="8.2s" dur="1.1s" fill="freeze"/></rect></clipPath>

    <clipPath id="c11"><rect x="70" y="1850" width="0" height="40"><animate attributeName="width" from="0" to="230" begin="9.4s" dur=".7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c12"><rect x="92" y="1900" width="0" height="38"><animate attributeName="width" from="0" to="635" begin="10.15s" dur="1.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="c13"><rect x="70" y="2004" width="0" height="40"><animate attributeName="width" from="0" to="250" begin="11.35s" dur=".7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c14"><rect x="92" y="2054" width="0" height="38"><animate attributeName="width" from="0" to="640" begin="12.1s" dur="1.15s" fill="freeze"/></rect></clipPath>

    <clipPath id="c15"><rect x="70" y="3100" width="0" height="40"><animate attributeName="width" from="0" to="245" begin="13.4s" dur=".75s" fill="freeze"/></rect></clipPath>
    <clipPath id="c16"><rect x="92" y="3150" width="0" height="38"><animate attributeName="width" from="0" to="630" begin="14.2s" dur="1.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="860" height="3600" rx="26" fill="url(#bg)"/>
  <rect x="2" y="2" width="856" height="3596" rx="24" fill="none" stroke="rgba(118,185,0,.16)"/>
  <rect x="22" y="22" width="816" height="3556" rx="22" fill="none" stroke="rgba(255,255,255,.055)"/>

  <rect x="0" y="-260" width="860" height="260" fill="url(#scanGradient)">
    <animate attributeName="y" from="-260" to="3860" dur="16s" repeatCount="indefinite"/>
  </rect>

  <circle cx="54" cy="54" r="6" fill="#374151"/>
  <circle cx="78" cy="54" r="6" fill="#2E3A46"/>
  <circle cx="102" cy="54" r="6" fill="#23303B"/>
  <text x="132" y="61" class="mono muted top">strecker@github: ~/profile</text>
  <circle cx="690" cy="54" r="6" fill="#76B900" filter="url(#softGlow)"/>
  <text x="708" y="61" class="mono green top">ONLINE</text>
  <text x="806" y="61" class="mono dim top" text-anchor="end">v5.0</text>
  <line x1="48" y1="88" x2="812" y2="88" stroke="rgba(255,255,255,.08)"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur=".45s" fill="freeze"/>
    <text x="64" y="208" class="sans fg headline">Strecker</text>
    <rect x="66" y="230" width="174" height="9" rx="4.5" fill="#76B900"/>
    <text x="64" y="290" class="mono muted subtitle">WINDOWS SOFTWARE / PERFORMANCE</text>
    <text x="64" y="328" class="mono muted subtitle">AUTOMATION / LOCAL AI</text>
    <text x="64" y="390" class="sans muted body">Practical software, measurable performance, clear interfaces.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".25s" dur=".4s" fill="freeze"/>
    <rect x="48" y="500" width="764" height="550" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="70" y="548" class="mono dim cardTitle">IDENTITY</text>
    <text x="786" y="548" class="mono green cardState" text-anchor="end">ACTIVE</text>
    <line x1="70" y1="570" x2="790" y2="570" stroke="rgba(255,255,255,.08)"/>

    <text x="70" y="630" class="mono green prompt" clip-path="url(#c1)">$ whoami</text>
    <text x="92" y="680" class="mono muted terminal" clip-path="url(#c2)">developer building fast, practical desktop tools</text>

    <text x="70" y="784" class="mono green prompt" clip-path="url(#c3)">$ focus.list</text>
    <text x="92" y="834" class="mono muted terminal" clip-path="url(#c4)">Windows · performance · automation · local AI</text>

    <text x="70" y="938" class="mono green prompt" clip-path="url(#c5)">$ status</text>
    <text x="92" y="988" class="mono green terminal" clip-path="url(#c6)">building, measuring, refining</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.4s" dur=".45s" fill="freeze"/>
    <rect x="48" y="1120" width="764" height="520" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="70" y="1168" class="mono dim cardTitle">FOCUS AREAS</text>
    <text x="786" y="1168" class="mono green cardState" text-anchor="end">CURRENT</text>
    <line x1="70" y1="1190" x2="790" y2="1190" stroke="rgba(255,255,255,.08)"/>

    <text x="70" y="1290" class="mono green prompt" clip-path="url(#c7)">$ performance</text>
    <text x="92" y="1340" class="mono muted terminal" clip-path="url(#c8)">benchmarking · telemetry · filtering · visualization</text>

    <text x="70" y="1444" class="mono green prompt" clip-path="url(#c9)">$ interface</text>
    <text x="92" y="1494" class="mono muted terminal" clip-path="url(#c10)">responsive desktop UX · clear information hierarchy</text>

    <circle cx="76" cy="1566" r="5" fill="#76B900"/>
    <text x="96" y="1574" class="sans fg body">Measured results over vague impressions</text>
    <circle cx="76" cy="1608" r="5" fill="#76B900"/>
    <text x="96" y="1616" class="sans fg body">Useful complexity, not visual noise</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9.1s" dur=".45s" fill="freeze"/>
    <rect x="48" y="1710" width="764" height="570" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="70" y="1758" class="mono dim cardTitle">TOOLBOX</text>
    <text x="786" y="1758" class="mono green cardState" text-anchor="end">READY</text>
    <line x1="70" y1="1780" x2="790" y2="1780" stroke="rgba(255,255,255,.08)"/>

    <text x="70" y="1880" class="mono green prompt" clip-path="url(#c11)">$ stack --core</text>
    <text x="92" y="1930" class="mono muted terminal" clip-path="url(#c12)">C# · .NET 10 · WPF · Windows desktop</text>

    <text x="70" y="2034" class="mono green prompt" clip-path="url(#c13)">$ stack --automation</text>
    <text x="92" y="2084" class="mono muted terminal" clip-path="url(#c14)">Python · PowerShell · GitHub Actions · local AI</text>

    <line x1="70" y1="2150" x2="790" y2="2150" stroke="rgba(255,255,255,.065)"/>
    <text x="70" y="2200" class="mono dim label">PRIMARY</text>
    <text x="250" y="2200" class="mono fg value">C# / .NET</text>
    <text x="70" y="2240" class="mono dim label">UI</text>
    <text x="250" y="2240" class="mono fg value">WPF / Windows</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="12.6s" dur=".45s" fill="freeze"/>
    <rect x="48" y="2350" width="764" height="500" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="70" y="2398" class="mono dim cardTitle">WORKFLOW</text>
    <text x="786" y="2398" class="mono green cardState" text-anchor="end">CURRENT</text>
    <line x1="70" y1="2420" x2="790" y2="2420" stroke="rgba(255,255,255,.08)"/>

    <circle cx="80" cy="2508" r="6" fill="#76B900"/>
    <text x="110" y="2518" class="sans fg body">Build practical tools, not noisy demos</text>
    <circle cx="80" cy="2584" r="6" fill="#76B900"/>
    <text x="110" y="2594" class="sans fg body">Turn raw data into something readable</text>
    <circle cx="80" cy="2660" r="6" fill="#76B900"/>
    <text x="110" y="2670" class="sans fg body">Keep interfaces fast, clean, and useful</text>
    <circle cx="80" cy="2736" r="6" fill="#76B900"/>
    <text x="110" y="2746" class="sans fg body">Automate repetition, preserve control</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="13.1s" dur=".45s" fill="freeze"/>
    <rect x="48" y="2920" width="764" height="500" rx="22" fill="url(#panel)" class="panelStroke"/>
    <text x="70" y="2968" class="mono dim cardTitle">FEATURED WORK</text>
    <text x="786" y="2968" class="mono green cardState" text-anchor="end">PUBLIC</text>
    <line x1="70" y1="2990" x2="790" y2="2990" stroke="rgba(255,255,255,.08)"/>

    <text x="70" y="3130" class="mono green prompt" clip-path="url(#c15)">$ frameview_analyzer</text>
    <text x="92" y="3180" class="mono muted terminal" clip-path="url(#c16)">native Windows benchmark analysis workspace</text>

    <text x="70" y="3260" class="sans fg section">FrameView Analyzer</text>
    <text x="70" y="3310" class="sans muted body">Analyzes NVIDIA FrameView captures and NVIDIA App</text>
    <text x="70" y="3348" class="sans muted body">performance logs with interactive charts, comparisons,</text>
    <text x="70" y="3386" class="sans muted body">filtering, visible-range statistics, and report exports.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="15.5s" dur=".45s" fill="freeze"/>
    <line x1="48" y1="3480" x2="812" y2="3480" stroke="rgba(255,255,255,.07)"/>
    <text x="64" y="3528" class="mono dim micro">PROFILE INTERFACE / CUSTOM SVG / SINGLE-LOAD INTRO</text>
    <text x="796" y="3564" class="mono dim micro" text-anchor="end">GITHUB.COM/STRECKERMX</text>
  </g>
</svg>
