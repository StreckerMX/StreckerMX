<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="7200" viewBox="0 0 1440 7200" role="img" aria-labelledby="title desc">
  <title id="title">Strecker developer profile</title>
  <desc id="desc">A long pure-black developer profile built as transparent Windows Terminal sessions with live GitHub telemetry and a soft green scan.</desc>

  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#76B900" stop-opacity="0.018"/>
      <stop offset="0.50" stop-color="#76B900" stop-opacity="0.15"/>
      <stop offset="0.70" stop-color="#76B900" stop-opacity="0.018"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, monospace; }
      .fg { fill:#F4F6F8; }
      .muted { fill:#A5AFB9; }
      .dim { fill:#6D7883; }
      .green { fill:#76B900; }
      .cyan { fill:#00D4FF; }
      .pink { fill:#FF6FAE; }
      .rule { stroke:#FFFFFF; stroke-opacity:.075; stroke-width:1.4; }
      .terminalOutline { fill:none; stroke:#404040; stroke-width:1.6; }
      .terminalTop { fill:#2D2D2D; }
      .tabActive { fill:#0B0B0B; }
      .tabText { font-size:21px; font-weight:600; }
      .topIcon { font-size:28px; }
      .windowButton { font-size:23px; }
      .ps { font-size:24px; font-weight:700; }
      .hero { font-size:92px; font-weight:720; letter-spacing:-.025em; }
      .heroSub { font-size:27px; letter-spacing:.10em; }
      .lead { font-size:32px; }
      .terminalTitle { font-size:20px; letter-spacing:.18em; }
      .terminalHeading { font-size:44px; font-weight:660; }
      .prompt { font-size:27px; font-weight:650; }
      .code { font-size:24px; }
      .body { font-size:27px; }
      .bodySmall { font-size:24px; }
      .metricLabel { font-size:19px; letter-spacing:.12em; }
      .metricValue { font-size:28px; font-weight:620; }
      .metricBig { font-size:36px; font-weight:680; }
      .footer { font-size:18px; letter-spacing:.13em; }
    </style>

    <g id="wtTop">
      <rect x="0" y="0" width="1216" height="64" rx="14" class="terminalTop"/>
      <rect x="0" y="0" width="246" height="64" rx="14" class="tabActive"/>
      <rect x="0" y="48" width="246" height="16" class="tabActive"/>
      <text x="34" y="40" class="sans fg tabText">strecker</text>
      <text x="214" y="41" class="sans fg topIcon">×</text>
      <line x1="246" y1="10" x2="246" y2="54" stroke="#444"/>
      <text x="274" y="42" class="sans fg topIcon">＋</text>
      <line x1="316" y1="10" x2="316" y2="54" stroke="#444"/>
      <text x="338" y="39" class="sans fg topIcon">⌄</text>
      <text x="1034" y="41" class="sans fg windowButton">−</text>
      <text x="1100" y="39" class="sans fg windowButton">□</text>
      <text x="1170" y="41" class="sans fg windowButton">×</text>
    </g>

    <clipPath id="type1"><rect x="112" y="548" width="0" height="45"><animate attributeName="width" from="0" to="195" begin=".5s" dur=".65s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="144" y="600" width="0" height="45"><animate attributeName="width" from="0" to="865" begin="1.2s" dur="1.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="type3"><rect x="112" y="670" width="0" height="45"><animate attributeName="width" from="0" to="250" begin="2.7s" dur=".75s" fill="freeze"/></rect></clipPath>
    <clipPath id="type4"><rect x="144" y="722" width="0" height="45"><animate attributeName="width" from="0" to="920" begin="3.5s" dur="1.35s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1440" height="7200" rx="34" fill="#000000"/>
  <rect x="2" y="2" width="1436" height="7196" rx="32" fill="none" stroke="#76B900" stroke-opacity=".10" stroke-width="2"/>
  <rect x="28" y="28" width="1384" height="7144" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>

  <rect x="0" y="-620" width="1440" height="620" fill="url(#scan)">
    <animate attributeName="y" from="-620" to="7820" dur="30s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0s" dur=".45s" fill="freeze"/>
    <text x="112" y="250" class="sans fg hero">Strecker</text>
    <rect x="114" y="280" width="190" height="10" rx="5" fill="#76B900"/>
    <text x="112" y="362" class="mono muted heroSub">WINDOWS SOFTWARE / PERFORMANCE / AUTOMATION / LOCAL AI</text>
    <text x="112" y="440" class="sans muted lead">Practical software. Measurable performance. Clear interfaces.</text>
  </g>
  <text x="112" y="578" class="mono green prompt" clip-path="url(#type1)">$ whoami</text>
  <text x="144" y="630" class="mono muted code" clip-path="url(#type2)">developer building fast, practical desktop tools and technical workflows</text>
  <text x="112" y="700" class="mono green prompt" clip-path="url(#type3)">$ status --current</text>
  <text x="144" y="752" class="mono muted code" clip-path="url(#type4)">building · measuring · refining · shipping</text>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.8s" dur=".55s" fill="freeze"/>
    <rect x="112" y="900" width="1216" height="850" rx="14" class="terminalOutline"/>
    <g transform="translate(112 900)"><use href="#wtTop"/></g>
    <text x="142" y="1018" class="mono green ps">PowerShell 7.6.5</text>
    <text x="142" y="1084" class="mono dim terminalTitle">01 / IDENTITY</text>
    <text x="142" y="1152" class="sans fg terminalHeading">What I build</text>
    <text x="142" y="1210" class="sans muted body">Desktop software and workflows where performance, clarity, and repeatability matter.</text>
    <text x="142" y="1315" class="mono green prompt">❯ whoami</text>
    <text x="174" y="1370" class="mono muted code">developer building fast, practical desktop tools</text>
    <text x="142" y="1470" class="mono green prompt">❯ priorities</text>
    <text x="174" y="1525" class="mono muted code">predictable behavior · readable complexity · measurable results</text>
    <line x1="142" y1="1600" x2="1298" y2="1600" class="rule"/>
    <text x="142" y="1670" class="mono dim metricLabel">PRIMARY</text><text x="370" y="1670" class="mono fg metricValue">C# / .NET</text>
    <text x="760" y="1670" class="mono dim metricLabel">UI</text><text x="930" y="1670" class="mono fg metricValue">WPF / Windows</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.0s" dur=".55s" fill="freeze"/>
    <rect x="112" y="1880" width="1216" height="1100" rx="14" class="terminalOutline"/>
    <g transform="translate(112 1880)"><use href="#wtTop"/></g>
    <text x="142" y="1998" class="mono green ps">PowerShell 7.6.5</text>
    <text x="142" y="2064" class="mono dim terminalTitle">02 / FOCUS</text>
    <text x="142" y="2132" class="sans fg terminalHeading">Where I spend my time</text>
    <text x="142" y="2190" class="sans muted body">The same themes keep showing up across the tools I build.</text>
    <text x="142" y="2305" class="mono green prompt">❯ performance</text>
    <text x="174" y="2360" class="sans fg body">Benchmarking, telemetry, filtering, visualization</text>
    <text x="174" y="2410" class="sans muted bodySmall">Turn noisy technical data into something you can inspect, compare, and trust.</text>
    <text x="142" y="2540" class="mono green prompt">❯ automation</text>
    <text x="174" y="2595" class="sans fg body">Repeatable workflows instead of repeated effort</text>
    <text x="174" y="2645" class="sans muted bodySmall">Scripts, CI, and practical AI tooling that remove friction from development.</text>
    <text x="142" y="2775" class="mono green prompt">❯ interface-design</text>
    <text x="174" y="2830" class="sans fg body">Technical software should still feel polished</text>
    <text x="174" y="2880" class="sans muted bodySmall">Information hierarchy and visual feedback are part of engineering.</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="7.4s" dur=".55s" fill="freeze"/>
    <rect x="112" y="3110" width="1216" height="1020" rx="14" class="terminalOutline"/>
    <g transform="translate(112 3110)"><use href="#wtTop"/></g>
    <text x="142" y="3228" class="mono green ps">PowerShell 7.6.5</text>
    <text x="142" y="3294" class="mono dim terminalTitle">03 / TOOLBOX</text>
    <text x="142" y="3362" class="sans fg terminalHeading">Tools I reach for</text>
    <text x="142" y="3420" class="sans muted body">A compact stack for desktop work, automation, testing, and delivery.</text>
    <line x1="142" y1="3490" x2="1298" y2="3490" class="rule"/>
    <text x="142" y="3580" class="mono dim metricLabel">LANGUAGE</text><text x="430" y="3580" class="mono fg metricValue">C#</text>
    <text x="142" y="3660" class="mono dim metricLabel">RUNTIME</text><text x="430" y="3660" class="mono fg metricValue">.NET 10</text>
    <text x="142" y="3740" class="mono dim metricLabel">DESKTOP UI</text><text x="430" y="3740" class="mono fg metricValue">WPF</text>
    <text x="142" y="3820" class="mono dim metricLabel">AUTOMATION</text><text x="430" y="3820" class="mono fg metricValue">Python · PowerShell</text>
    <text x="142" y="3900" class="mono dim metricLabel">DELIVERY</text><text x="430" y="3900" class="mono fg metricValue">GitHub Actions · Releases</text>
    <text x="142" y="3980" class="mono dim metricLabel">AI WORKFLOWS</text><text x="430" y="3980" class="mono green metricValue">Local models · API-assisted development</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8.8s" dur=".55s" fill="freeze"/>
    <rect x="112" y="4260" width="1216" height="820" rx="14" class="terminalOutline"/>
    <g transform="translate(112 4260)"><use href="#wtTop"/></g>
    <text x="142" y="4378" class="mono green ps">PowerShell 7.6.5</text>
    <text x="142" y="4444" class="mono dim terminalTitle">04 / WORKFLOW</text>
    <text x="142" y="4512" class="sans fg terminalHeading">How I like to work</text>
    <text x="142" y="4570" class="sans muted body">Small feedback loops, measurable results, and less ceremony.</text>
    <text x="142" y="4680" class="mono green prompt">01 inspect</text><text x="410" y="4680" class="mono muted code">understand the actual problem</text>
    <text x="142" y="4770" class="mono green prompt">02 build</text><text x="410" y="4770" class="mono muted code">prefer the simplest clear solution</text>
    <text x="142" y="4860" class="mono green prompt">03 measure</text><text x="410" y="4860" class="mono muted code">test performance, behavior, and UX</text>
    <text x="142" y="4950" class="mono green prompt">04 refine</text><text x="410" y="4950" class="mono muted code">remove friction and fragile edges</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="10.2s" dur=".55s" fill="freeze"/>
    <rect x="112" y="5210" width="1216" height="1430" rx="14" class="terminalOutline"/>
    <g transform="translate(112 5210)"><use href="#wtTop"/></g>
    <text x="142" y="5328" class="mono green ps">PowerShell 7.6.5</text>
    <text x="142" y="5394" class="mono dim terminalTitle">05 / LIVE PROJECT TELEMETRY</text>
    <text x="142" y="5462" class="sans fg terminalHeading">FrameView Analyzer</text>
    <text x="142" y="5520" class="sans muted body">Real repository data, refreshed automatically by GitHub Actions.</text>
    <text x="1298" y="5328" class="mono dim code" text-anchor="end">SYNC 2026-08-22 UTC</text>
    <line x1="142" y1="5590" x2="1298" y2="5590" class="rule"/>
    <text x="142" y="5690" class="mono dim metricLabel">LATEST RELEASE</text><text x="142" y="5750" class="mono fg metricBig">v2.3.0</text>
    <text x="510" y="5690" class="mono dim metricLabel">STARS</text><text x="510" y="5750" class="mono fg metricBig">2</text>
    <text x="760" y="5690" class="mono dim metricLabel">CI</text><text x="760" y="5750" class="mono green metricBig">PASSING</text>
    <text x="1060" y="5690" class="mono dim metricLabel">OPEN PRS</text><text x="1060" y="5750" class="mono fg metricBig">0</text>
    <line x1="142" y1="5830" x2="1298" y2="5830" class="rule"/>
    <text x="142" y="5920" class="mono dim metricLabel">PRIMARY LANGUAGE</text><text x="450" y="5920" class="mono fg metricValue">C#</text>
    <text x="770" y="5920" class="mono dim metricLabel">RELEASE DATE</text><text x="1040" y="5920" class="mono fg metricValue">2026-08-19</text>
    <text x="142" y="6060" class="mono green prompt">❯ git log -1 --oneline</text>
    <text x="174" y="6120" class="mono fg code">ef584d9  Release FrameView Analyzer 2.3.0 (#27)</text>
    <text x="174" y="6170" class="mono dim code">committed 2026-08-19</text>
    <line x1="142" y1="6260" x2="1298" y2="6260" class="rule"/>
    <text x="142" y="6350" class="mono dim metricLabel">STATUS</text><text x="410" y="6350" class="mono green metricValue">BUILDING · REFINING · RELEASING</text>
    <text x="142" y="6450" class="sans muted body">Native Windows benchmark analysis for NVIDIA FrameView captures and NVIDIA App logs.</text>
    <text x="142" y="6502" class="sans muted bodySmall">Telemetry is generated from the repository itself, not a third-party badge service.</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="11.8s" dur=".55s" fill="freeze"/>
    <line x1="112" y1="6870" x2="1328" y2="6870" class="rule"/>
    <text x="112" y="6950" class="mono dim footer">PROFILE INTERFACE / WINDOWS TERMINAL / TRANSPARENT SHELL / LIVE TELEMETRY</text>
    <text x="1328" y="6950" class="mono dim footer" text-anchor="end">GITHUB.COM/STRECKERMX</text>
    <circle cx="112" cy="7020" r="6" fill="#76B900" filter="url(#glow)"/>
    <text x="140" y="7028" class="mono green ps">still building</text>
  </g>
</svg>