<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Strecker profile hero</title>
  <desc id="desc">Animated dark dashboard style profile hero for Strecker, with one-time type-in text and a subtle green scan line.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090C"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101410"/>
    </linearGradient>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#76B900" stop-opacity="0.04"/>
      <stop offset="0.5" stop-color="#76B900" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#76B900" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131920"/>
      <stop offset="1" stop-color="#0F1318"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fg { fill: #F2F5F7; }
      .muted { fill: #97A4B2; }
      .dim { fill: #6F7D8B; }
      .green { fill: #76B900; }
      .green-stroke { stroke: #76B900; }
      .panel-stroke { stroke: rgba(255,255,255,0.08); }
      .micro { font-size: 12px; letter-spacing: 0.12em; }
      .small { font-size: 15px; letter-spacing: 0.02em; }
      .label { font-size: 13px; letter-spacing: 0.12em; }
      .value { font-size: 17px; font-weight: 600; }
      .headline { font-size: 66px; font-weight: 700; }
      .subheadline { font-size: 21px; letter-spacing: 0.11em; }
      .section { font-size: 19px; font-weight: 600; }
      .body { font-size: 18px; }
      .terminalPrompt { font-size: 24px; font-weight: 600; }
      .terminalText { font-size: 20px; }
    </style>

    <clipPath id="t1"><rect x="54" y="234" width="0" height="30"><animate attributeName="width" from="0" to="122" begin="0.45s" dur="0.55s" fill="freeze" /></rect></clipPath>
    <clipPath id="t2"><rect x="72" y="272" width="0" height="28"><animate attributeName="width" from="0" to="468" begin="1.05s" dur="1.15s" fill="freeze" /></rect></clipPath>
    <clipPath id="t3"><rect x="54" y="342" width="0" height="30"><animate attributeName="width" from="0" to="145" begin="2.05s" dur="0.7s" fill="freeze" /></rect></clipPath>
    <clipPath id="t4"><rect x="72" y="380" width="0" height="28"><animate attributeName="width" from="0" to="452" begin="2.78s" dur="1.15s" fill="freeze" /></rect></clipPath>
    <clipPath id="t5"><rect x="54" y="450" width="0" height="30"><animate attributeName="width" from="0" to="184" begin="4.1s" dur="0.82s" fill="freeze" /></rect></clipPath>
    <clipPath id="t6"><rect x="72" y="488" width="0" height="28"><animate attributeName="width" from="0" to="377" begin="4.98s" dur="1.0s" fill="freeze" /></rect></clipPath>
    <clipPath id="t7"><rect x="54" y="558" width="0" height="30"><animate attributeName="width" from="0" to="218" begin="6.15s" dur="0.85s" fill="freeze" /></rect></clipPath>
    <clipPath id="t8"><rect x="72" y="596" width="0" height="28"><animate attributeName="width" from="0" to="332" begin="7.08s" dur="1.0s" fill="freeze" /></rect></clipPath>
    <clipPath id="t9"><rect x="54" y="666" width="0" height="30"><animate attributeName="width" from="0" to="136" begin="8.1s" dur="0.62s" fill="freeze" /></rect></clipPath>
    <clipPath id="t10"><rect x="72" y="704" width="0" height="28"><animate attributeName="width" from="0" to="596" begin="8.82s" dur="1.45s" fill="freeze" /></rect></clipPath>
  </defs>

  <rect width="1200" height="860" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="857" rx="22.5" fill="none" stroke="rgba(118,185,0,0.18)"/>
  <rect x="18" y="18" width="1164" height="824" rx="20" fill="none" stroke="rgba(255,255,255,0.06)"/>

  <rect x="-300" y="0" width="300" height="860" fill="url(#scanGradient)">
    <animate attributeName="x" from="-300" to="1500" dur="14s" repeatCount="indefinite" />
  </rect>

  <circle cx="46" cy="40" r="5" fill="#374151"/>
  <circle cx="64" cy="40" r="5" fill="#2E3A46"/>
  <circle cx="82" cy="40" r="5" fill="#23303B"/>
  <text x="112" y="45" class="mono muted small">strecker@github: ~/profile</text>
  <circle cx="1046" cy="39" r="5" fill="#76B900" filter="url(#softGlow)"/>
  <text x="1060" y="45" class="mono green small">ONLINE</text>
  <text x="1135" y="45" class="mono dim small" text-anchor="end">v3.0</text>
  <line x1="34" y1="60" x2="1166" y2="60" stroke="rgba(255,255,255,0.08)"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
    <text x="54" y="118" class="sans fg headline">Strecker</text>
    <rect x="54" y="136" width="118" height="7" rx="3.5" fill="#76B900"/>
    <text x="54" y="182" class="mono muted subheadline">WINDOWS SOFTWARE / PERFORMANCE / AUTOMATION / LOCAL AI</text>
  </g>

  <g>
    <text x="54" y="258" class="mono green terminalPrompt" clip-path="url(#t1)">$ whoami</text>
    <text x="72" y="294" class="mono muted terminalText" clip-path="url(#t2)">developer focused on fast, practical desktop tools</text>
    <text x="54" y="366" class="mono green terminalPrompt" clip-path="url(#t3)">$ focus.list</text>
    <text x="72" y="402" class="mono muted terminalText" clip-path="url(#t4)">Windows apps · performance analysis · automation · local AI</text>
    <text x="54" y="474" class="mono green terminalPrompt" clip-path="url(#t5)">$ stack --core</text>
    <text x="72" y="510" class="mono muted terminalText" clip-path="url(#t6)">C# · .NET 10 · WPF · Python · PowerShell · GitHub Actions</text>
    <text x="54" y="582" class="mono green terminalPrompt" clip-path="url(#t7)">$ featured_work</text>
    <text x="72" y="618" class="mono muted terminalText" clip-path="url(#t8)">FrameView Analyzer — benchmark analysis workspace for Windows</text>
    <text x="54" y="690" class="mono green terminalPrompt" clip-path="url(#t9)">$ status</text>
    <text x="72" y="726" class="mono green terminalText" clip-path="url(#t10)">building, measuring, refining<span> </span></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
    <rect x="760" y="108" width="360" height="170" rx="16" fill="url(#panel)" class="panel-stroke"/>
    <text x="782" y="136" class="mono dim label">DEV TELEMETRY</text>
    <text x="1088" y="136" class="mono green label" text-anchor="end">LIVE</text>
    <line x1="782" y1="150" x2="1098" y2="150" stroke="rgba(255,255,255,0.08)"/>
    <text x="782" y="188" class="mono dim label">PRIMARY</text>
    <text x="884" y="188" class="mono fg value">C# / .NET</text>
    <text x="782" y="223" class="mono dim label">UI</text>
    <text x="884" y="223" class="mono fg value">WPF / Windows</text>
    <text x="782" y="258" class="mono dim label">FOCUS</text>
    <text x="884" y="258" class="mono fg value">Performance + UX</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.5s" fill="freeze"/>
    <rect x="760" y="308" width="360" height="190" rx="16" fill="url(#panel)" class="panel-stroke"/>
    <text x="782" y="336" class="mono dim label">WORKFLOW</text>
    <text x="1088" y="336" class="mono green label" text-anchor="end">CURRENT</text>
    <line x1="782" y1="350" x2="1098" y2="350" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="788" cy="387" r="4" fill="#76B900"/>
    <text x="805" y="392" class="sans fg body">Build practical tools, not noisy demos</text>
    <circle cx="788" cy="427" r="4" fill="#76B900"/>
    <text x="805" y="432" class="sans fg body">Turn raw data into something readable</text>
    <circle cx="788" cy="467" r="4" fill="#76B900"/>
    <text x="805" y="472" class="sans fg body">Keep interfaces fast, clean, and useful</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.5s" fill="freeze"/>
    <rect x="760" y="528" width="360" height="214" rx="16" fill="url(#panel)" class="panel-stroke"/>
    <text x="782" y="556" class="mono dim label">FEATURED WORK</text>
    <text x="1088" y="556" class="mono green label" text-anchor="end">PUBLIC</text>
    <line x1="782" y1="570" x2="1098" y2="570" stroke="rgba(255,255,255,0.08)"/>
    <text x="782" y="610" class="sans fg section">FrameView Analyzer</text>
    <text x="782" y="642" class="sans muted body">Native Windows application for analyzing NVIDIA</text>
    <text x="782" y="668" class="sans muted body">FrameView captures and NVIDIA App performance logs.</text>
    <rect x="782" y="694" width="106" height="28" rx="14" fill="rgba(118,185,0,0.14)" stroke="rgba(118,185,0,0.35)"/>
    <text x="835" y="713" class="mono green small" text-anchor="middle">SOURCE</text>
    <rect x="900" y="694" width="126" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="963" y="713" class="mono fg small" text-anchor="middle">RELEASES</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.5s" fill="freeze"/>
    <line x1="36" y1="792" x2="1164" y2="792" stroke="rgba(255,255,255,0.07)"/>
    <text x="54" y="817" class="mono dim micro">PROFILE INTERFACE / CUSTOM SVG / SINGLE-LOAD INTRO</text>
    <text x="1144" y="817" class="mono dim micro" text-anchor="end">GITHUB.COM/STRECKERMX</text>
  </g>
</svg>